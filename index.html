<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Pebbles — GUI Framework for Rust</title>
  <meta name="description" content="Pebbles — a Flutter-style, GPU-accelerated GUI framework for Rust. Reactive signals, 60+ shadcn-styled widgets, one codebase for desktop, web, and mobile." />
  <link rel="icon" type="image/png" href="assets/pebbles.png" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
    /* Fill the viewport and beat any inline size winit sets on the canvas, so the
       surface tracks the window (Flutter-style: canvas = viewport, buffer = size*dpr). */
    canvas {
      position: fixed; inset: 0;
      width: 100% !important; height: 100% !important;
      display: block; outline: none; touch-action: none;
    }
    #pebbles-no-webgpu {
      font: 15px/1.5 system-ui, sans-serif; color: #334155; max-width: 34rem;
      margin: 12vh auto; padding: 0 1.5rem; text-align: center;
    }
  </style>
  <!-- Friendly message instead of a wasm panic when the browser lacks WebGPU
       (Pebbles is WebGPU-only — no WebGL2 fallback). -->
  <script>
    if (!navigator.gpu) {
      addEventListener('DOMContentLoaded', function () {
        document.body.innerHTML =
          '<div id="pebbles-no-webgpu"><h2>This app needs WebGPU</h2>' +
          '<p>Open it in Chrome/Edge, Safari&nbsp;26+, or Firefox with WebGPU enabled. ' +
          'On Linux Chrome you may need <code>chrome://flags</code> → Unsafe WebGPU + Vulkan.</p></div>';
      });
    }
  </script>
  <!-- Build this crate to wasm. Trunk runs cargo + wasm-bindgen, and wasm-opt on
       --release. `pebbles run -d web` reuses this same file (it prefers a project's
       own index.html over its generated one), so dev and the deployed build match. -->
  <link data-trunk rel="rust" href="./Cargo.toml" data-bin="gallery" />
  <!-- Copy the mascot asset into the bundle so the favicon + in-app logo resolve. -->
  <link data-trunk rel="copy-dir" href="assets" />
</head>
<body></body>
</html>
